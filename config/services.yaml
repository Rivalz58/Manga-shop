# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    upload_directory: '%kernel.project_dir%/public/uploads/cards'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Service\FileUploadService:
        arguments:
            $uploadDir: '%upload_directory%'

    App\Security\MongoDBUserProvider:
        arguments:
            $dm: '@doctrine_mongodb.odm.default_document_manager'
