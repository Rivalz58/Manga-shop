security:
    password_hashers:
        App\Document\Utilisateur: 'auto'

    providers:
        mongodb_provider:
            id: App\Security\MongoDBUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: mongodb_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_home
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            logout:
                path: app_logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/compte, roles: ROLE_USER }
        - { path: ^/commande/valider, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Document\Utilisateur:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
